<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padaria Água na Boca</title>
    <link rel="stylesheet" href="assets/css/cadastro.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet"> 
</head>
<body>
    <main class="container">
        <div class="card" id="info-login">
            <img src="assets/imagens/logo.jpg" alt="Logo Padaria" height="250px" width="250px">
            <h1>Padaria Água na Boca</h1>
            <h2>Cadastro</h2>
        </div>
        <div class="card">
            <form method="post" id="form-login">
                <p id="titulo">Cadastro</p>
                <label for="nome_completo">Nome Completo:</label>
                <input type="text" name="nome_completo" id="nome_completo" placeholder="Digite seu nome completo..." required>

                <label for="cpf">CPF:</label>
                <input type="text" name="cpf" id="cpf" minlength="14" maxlength="14" title="Ex: 123.456.789-10" inputmode="numeric" pattern="\d{3}.\d{3}.\d{3}-\d{2}" oninput="this.value = this.value.replace(/[^\d.-]/g, '')" placeholder="123.456.789-10" required>

                <label for="endereco">Endereço:</label>
                <input type="text" name="endereco" id="endereco" placeholder="Digite seu Endereço..." required>

                <label for="email">E-mail:</label>
                <input type="email" name="email" id="email" required  placeholder="Digite seu E-mail..." required>

                <label for="senha">Crie uma Senha:</label>
                <input type="password" name="senha" id="senha" minlength="8" required  placeholder="Crie sua senha..." required>

                <label for="senha_confirma">Confirme sua Senha:</label>
                <input type="password" name="senha_confirma" id="senha_confirma" minlength="8" required  placeholder="Confirme sua senha..." required>


                <div class="form-group" id="termos-e-condicoes">
                    <div class="form-opt">
                        <input type="checkbox" name="termos" id="termos" required>
                        <label for="termos">Aceito os <a href="#termos">Termos</a> e <a href="#condicoes">Condições</a> do site</label>
                    </div>
                </div>

                <input type="submit" value="Concluir Cadastro">
            </form>
        </div>
    </main>
</body>
</html>
